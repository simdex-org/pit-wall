<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'">
<title>Pit Wall module</title>
<script>
  addEventListener("message", function boot(e) {
    if (e.source !== parent || !e.data || e.data.type !== "source" || typeof e.data.html !== "string") return;
    removeEventListener("message", boot);
    document.open();
    document.write(e.data.html);
    document.close();
  });
  parent.postMessage({ type: "ready" }, "*");
</script>
