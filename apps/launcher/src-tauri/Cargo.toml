[package]
name = "pitwall-launcher"
version = "1.0.3-f"
description = "Starts the Pit Wall bridge without a terminal"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[features]
portable = ["dep:zip"]

[profile.release]
strip = true
